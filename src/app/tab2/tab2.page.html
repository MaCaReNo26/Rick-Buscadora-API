<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Mis Favoritos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (favoritesList.length === 0) {
    <div class="ion-text-center ion-padding">
      <p>No tienes personajes agregados a favoritos.</p>
    </div>
  } @else {
    <ion-list>
      @for (item of favoritesList; track item.id) {
        <ion-item lines="full">
          <ion-avatar slot="start">
            <img [src]="item.image" [alt]="item.name" />
          </ion-avatar>
          <ion-label>
            <h2>{{ item.name }}</h2>
            <p>{{ item.species }} - {{ item.gender }}</p>
          </ion-label>
          <ion-button fill="clear" color="danger" slot="end" (click)="removeFavorite(item)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
